services:
  postgres:
    image: postgres:16-alpine
    container_name: pitchzone-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitchzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitchzone_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pitchzone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pitchzone} -d ${POSTGRES_DB:-pitchzone}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pitchzone-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
