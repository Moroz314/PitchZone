meta:
  environment: docker
  toolchain:
    name: docker

build:
  # Используем наш объединённый Dockerfile для монорепозитория
  dockerfile: Dockerfile.amvera

run:
  # Пробрасываем порты. Наш контейнер сам разберётся на каком порту слушать 
  # в зависимости от сервиса, но для Amvera мы укажем порты.
  # Amvera переопределит переменную PORT внутри контейнера.
  # Если это API (обычно на 3001) или Web (3000), они подхватят PORT от Amvera.
  command: ["./amvera-start.sh"]
